[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "protocol-archive"
version = "0.2.0"
description = "Локальный архив протоколов об административных правонарушениях (MVP, этап 1)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "PyMuPDF>=1.23,<2",
    "python-docx>=1.0",
    "odfpy>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
protocol-archive = "protocol_archive.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
